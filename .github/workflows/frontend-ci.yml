name: Frontend CI

on:
  pull_request:
    paths:
      - 'fe-app-netshift/**'
      - 'luci-app-netshift/po/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  locales-check:
    name: Translation completeness
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'

      # check-locales.js has no dependencies, so this job needs no install step:
      # it fails when a string the UI uses has no translation (msgstr ""), when a
      # translation is left over from a string that no longer exists, or when the
      # copy the LuCI package compiles has drifted from the source catalogue.
      - name: Check translations
        run: node fe-app-netshift/check-locales.js

  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe-app-netshift

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        working-directory: fe-app-netshift
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4.3.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('fe-app-netshift/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        id: format
        run: |
          yarn format
          if ! git diff --exit-code; then
            echo "::error::Code is not formatted. Run 'yarn format' locally."
            exit 1
          fi

      # The catalogues are generated from locales/calls.json, so a new
      # translatable string that was never extracted would silently stay
      # untranslated: the locale check below only sees what calls.json lists.
      # extract-calls.js is deterministic, so a diff here means it is stale.
      - name: Check locale call extraction
        run: |
          yarn locales:extract-calls
          if ! git diff --exit-code locales/calls.json; then
            echo "::error::Translatable strings changed without extracting them. Run 'yarn locales:actualize' locally."
            exit 1
          fi

      - name: Check translations
        run: yarn locales:check

      - name: Run linter
        run: yarn lint --max-warnings=0

      - name: Run tests
        run: yarn test --run

      - name: Build project
        id: build
        run: |
          yarn build
          if ! git diff --exit-code; then
            echo "::error::Build generated changes. Check build output."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Frontend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Format check: ${{ steps.format.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint check: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "![Success](https://cdn2.combot.org/boratbrat/webp/6xf09f988f.webp)" >> $GITHUB_STEP_SUMMARY