name: OpenWrt Smoke Tests

on:
  push:
    branches:
      - main
      - 'rc/**'
    paths:
      - 'netshift/**'
      - 'luci-app-netshift/**'
      - 'tests/**'
      - 'install.sh'
      - 'Dockerfile-ipk'
      - 'Dockerfile-apk'
      - '.dockerignore'
      - '.github/workflows/openwrt-smoke-tests.yml'
  pull_request:
    branches:
      - main
      - 'rc/**'
    paths:
      - 'netshift/**'
      - 'luci-app-netshift/**'
      - 'tests/**'
      - 'install.sh'
      - 'Dockerfile-ipk'
      - 'Dockerfile-apk'
      - '.dockerignore'
      - '.github/workflows/openwrt-smoke-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: OpenWrt rootfs smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build OpenWrt smoke test image
        uses: docker/build-push-action@v7.4.0
        with:
          file: ./tests/Dockerfile
          context: .
          tags: netshift-evolution:test
          build-args: NETSHIFT_VERSION=test
          load: true
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke

      - name: Run OpenWrt smoke tests
        run: docker compose -f tests/docker-compose.yml run --rm netshift-test all

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openwrt-smoke-test-results
          path: tests/test-results
          if-no-files-found: ignore
          retention-days: 7
