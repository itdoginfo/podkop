name: OpenWrt Smoke Tests

on:
  push:
    branches:
      - main
      - 'rc/**'
    paths:
      - 'netshift/**'
      - 'luci-app-netshift/**'
      - 'tests/**'
      - 'install.sh'
      - 'Dockerfile-ipk'
      - 'Dockerfile-apk'
      - '.dockerignore'
      - '.github/workflows/openwrt-smoke-tests.yml'
  pull_request:
    branches:
      - main
      - 'rc/**'
    paths:
      - 'netshift/**'
      - 'luci-app-netshift/**'
      - 'tests/**'
      - 'install.sh'
      - 'Dockerfile-ipk'
      - 'Dockerfile-apk'
      - '.dockerignore'
      - '.github/workflows/openwrt-smoke-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The suite is split into shards that run side by side (tests/entrypoint.sh, SMOKE_SHARD):
  # one after another it took longer than the package build.
  smoke-shards:
    name: Smoke tests ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build OpenWrt smoke test image
        uses: docker/build-push-action@v7.4.0
        with:
          file: ./tests/Dockerfile
          context: .
          # Must match `image:` in tests/docker-compose.yml: `compose run` below
          # uses this image and would silently rebuild it (uncached) otherwise.
          tags: netshift-evolution:test
          # The rootfs and sing-box-extended in tests/Dockerfile are x86_64.
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=smoke
          # Pull-request runs only read the cache: they share the repository's
          # 10 GB budget with tag builds and must not evict their layers. A cache
          # export failure never fails the build.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=smoke,ignore-error=true' || '' }}

      - name: Run OpenWrt smoke tests
        run: docker compose -f tests/docker-compose.yml run --rm -e SMOKE_SHARD=${{ matrix.shard }} netshift-test all

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openwrt-smoke-test-results
          path: tests/test-results
          if-no-files-found: ignore
          retention-days: 7

  # One check under the old name, for whatever waits for it
  smoke-tests:
    name: OpenWrt rootfs smoke tests
    runs-on: ubuntu-24.04
    needs: smoke-shards
    if: always()
    steps:
      - name: All shards passed
        run: |
          [ "${{ needs.smoke-shards.result }}" = "success" ] || { echo "smoke shards: ${{ needs.smoke-shards.result }}"; exit 1; }
